<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Простой Тетрис</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      color: white;
      background: #111827;
      font-family: Arial, sans-serif;
    }
    .game { display: flex; gap: 24px; align-items: flex-start; }
    canvas { background: #050914; border: 3px solid #475569; }
    h1 { margin-top: 0; }
    button {
      padding: 10px 16px;
      border: 0;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }
    .help { line-height: 1.7; color: #cbd5e1; }
  </style>
</head>
<body>
  <main class="game">
    <canvas id="game" width="300" height="600"></canvas>
    <section>
      <h1>Тетрис</h1>
      <h2>Счёт: <span id="score">0</span></h2>
      <button id="restart">Новая игра</button>
      <p class="help">
        ← → двигать<br>
        ↑ повернуть<br>
        ↓ ускорить<br>
        Пробел — сбросить
      </p>
    </section>
  </main>

  <script>
    const canvas = document.querySelector('#game');
    const ctx = canvas.getContext('2d');
    const scoreText = document.querySelector('#score');
    const COLS = 10, ROWS = 20, SIZE = 30;
    const colors = ['#000', '#22d3ee', '#fde047', '#c084fc', '#4ade80', '#f87171', '#60a5fa', '#fb923c'];
    const shapes = [
      [[1,1,1,1]],
      [[2,2],[2,2]],
      [[0,3,0],[3,3,3]],
      [[0,4,4],[4,4,0]],
      [[5,5,0],[0,5,5]],
      [[6,0,0],[6,6,6]],
      [[0,0,7],[7,7,7]]
    ];

    let board, piece, score, lastTime, gameOver;

    function newPiece() {
      const shape = shapes[Math.floor(Math.random() * shapes.length)];
      piece = { shape, x: Math.floor((COLS - shape[0].length) / 2), y: 0 };
      if (collides(piece.x, piece.y, piece.shape)) gameOver = true;
    }

    function collides(x, y, shape) {
      return shape.some((row, py) => row.some((value, px) =>
        value && (x + px < 0 || x + px >= COLS || y + py >= ROWS ||
        (y + py >= 0 && board[y + py][x + px]))
      ));
    }

    function merge() {
      piece.shape.forEach((row, y) => row.forEach((value, x) => {
        if (value) board[piece.y + y][piece.x + x] = value;
      }));
    }

    function clearLines() {
      let lines = 0;
      for (let y = ROWS - 1; y >= 0; y--) {
        if (board[y].every(Boolean)) {
          board.splice(y, 1);
          board.unshift(Array(COLS).fill(0));
          lines++;
          y++;
        }
      }
      score += [0, 100, 300, 500, 800][lines];
      scoreText.textContent = score;
    }

    function drop() {
      if (!collides(piece.x, piece.y + 1, piece.shape)) piece.y++;
      else {
        merge();
        clearLines();
        newPiece();
      }
    }

    function rotate() {
      const turned = piece.shape[0].map((_, i) => piece.shape.map(row => row[i]).reverse());
      if (!collides(piece.x, piece.y, turned)) piece.shape = turned;
    }

    function drawBlock(x, y, color) {
      ctx.fillStyle = colors[color];
      ctx.fillRect(x * SIZE, y * SIZE, SIZE, SIZE);
      ctx.strokeStyle = '#ffffff33';
      ctx.strokeRect(x * SIZE, y * SIZE, SIZE, SIZE);
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      board.forEach((row, y) => row.forEach((value, x) => value && drawBlock(x, y, value)));
      piece.shape.forEach((row, y) => row.forEach((value, x) => value && drawBlock(piece.x + x, piece.y + y, value)));
      if (gameOver) {
        ctx.fillStyle = '#000b';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = 'white';
        ctx.font = 'bold 30px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('Игра окончена', canvas.width / 2, canvas.height / 2);
      }
    }

    function loop(time = 0) {
      if (!gameOver && time - lastTime > 600) {
        drop();
        lastTime = time;
      }
      draw();
      requestAnimationFrame(loop);
    }

    function start() {
      board = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
      score = 0;
      lastTime = 0;
      gameOver = false;
      scoreText.textContent = score;
      newPiece();
    }

    document.addEventListener('keydown', event => {
      if (gameOver) return;
      if (['ArrowLeft', 'ArrowRight', 'ArrowDown', 'ArrowUp', ' '].includes(event.key)) event.preventDefault();
      if (event.key === 'ArrowLeft' && !collides(piece.x - 1, piece.y, piece.shape)) piece.x--;
      if (event.key === 'ArrowRight' && !collides(piece.x + 1, piece.y, piece.shape)) piece.x++;
      if (event.key === 'ArrowDown') drop();
      if (event.key === 'ArrowUp') rotate();
      if (event.key === ' ') while (!collides(piece.x, piece.y + 1, piece.shape)) piece.y++;
    });

    document.querySelector('#restart').addEventListener('click', start);
    start();
    loop();
  </script>
</body>
</html>
